<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Yanelle Bryan A.</title>

  <!-- Modular CSS -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <!-- Favicon -->
  <link rel="icon" href="assets/parkalisto_transparent_logo.png" type="image/png" />

  <style>
    .page-404 {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      position: relative;
      z-index: 1;
    }
    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(80px, 20vw, 160px);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }
    .error-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 16px;
      color: var(--text-secondary);
      max-width: 420px;
      line-height: 1.65;
      margin: 0 auto 40px;
    }
    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- ── ANIMATED BACKGROUND ── -->
  <div class="bg-canvas" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="page-404">
    <div>
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">
        Looks like this page doesn't exist — or it moved somewhere else.
        Head back to the portfolio and explore what's there.
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">
          ← Back to Portfolio
        </a>
        <a href="mailto:yanellebryan@gmail.com" class="btn btn-ghost">
          Contact Me
        </a>
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
</body>
</html>
